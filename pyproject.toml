[project]
name = "pyPodControl"
version = "0.0a1"
authors = [
  { name="RaduTek", email="me@radutek.uk" },
]
description = "Python implementation of iPod Accessory Protocol"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5"
]

[project.optional-dependencies]
usb = ["hidapi>=0.14"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/RaduTek/pyPodControl"
Issues = "https://github.com/RaduTek/pyPodControl/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[build]
files = ["src/pypodcontrol/*"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
